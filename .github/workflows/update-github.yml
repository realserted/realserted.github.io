name: Refresh GitHub contributions

on:
  schedule:
    # 06:00 UTC daily — early afternoon in Cebu, after the previous day closes.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-contributions
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Regenerate the contribution snapshot
        env:
          # Classic PAT with read:user, or a fine-grained token that can read
          # your profile. The default GITHUB_TOKEN cannot read a user's
          # contribution calendar.
          GH_STATS_TOKEN: ${{ secrets.GH_STATS_TOKEN }}
          GH_LOGIN: ${{ github.repository_owner }}
        run: |
          if [ -z "$GH_STATS_TOKEN" ]; then
            echo "::warning::GH_STATS_TOKEN is not set — skipping the refresh."
            exit 0
          fi
          node scripts/update-github.mjs

      - name: Commit if the numbers moved
        run: |
          if git diff --quiet -- index.html; then
            echo "No change to index.html."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Refresh GitHub contribution snapshot"
          git push
