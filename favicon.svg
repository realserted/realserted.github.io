<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The LLS wordmark's L, slanted like the nav's italic serif. Ground and
       letter swap for dark browser chrome. -->
  <style>
    .ground { fill: #2E251C }  /* Ink      */
    .letter { fill: #F1EADA }  /* Vanilla  */
    @media (prefers-color-scheme: dark) {
      .ground { fill: #D6BD98 }  /* Almond  */
      .letter { fill: #0E1312 }  /* Paper   */
    }
  </style>
  <rect class="ground" width="32" height="32" rx="7"/>
  <path class="letter" d="M14.2 6.5 L18.6 6.5 L15.2 21.2 L23 21.2 L22.2 25 L9.8 25 Z"/>
</svg>
